<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Styled Page</title>

  <style>
    /* Internal stylesheet */
    h1 {
       font-size: 42px; 
    }

    p {
      color: #333333;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1 style="color: blue;">Welcome to CSS!</h1>
    <nav>
      <a href="#methods">Methods</a>
      <a href="#prices">Prices</a>
    </nav>
  </header>

  <p id="methods">This page demonstrates three CSS methods.</p>
  <p class="highlight" style="background-color:green;">This paragraph should stand out.</p>
  <p>Learn more in <a href="https://developer.mozilla.org/en-US/docs/Web/CSS">the MDN CSS guide</a>.</p>
  <p style="color:azure; background-color: navy">Light text on dark background</p>

  <table id="prices">
    <caption>Snack Prices</caption>
    <tr>
      <th>Snack</th>
      <th>Price</th>
    </tr>
    <tr>
      <td>Chips</td>
      <td>$1.50</td>
    </tr>
    <tr>
      <td>Pretzels</td>
      <td>$1.25</td>
    </tr>
  </table>

  <footer id="footer">&copy; 2026 My Website</footer>

</body>
</html>
