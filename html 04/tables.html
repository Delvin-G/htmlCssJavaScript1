<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, td {border: 3px solid #333; border-collapse: collapse;}
        th, td {padding: 45px}
        th { background-color: dodgerblue;}
    </style>
</head>
<body>
    <h1>Lunch Menu</h1>
    <table>
        <caption>Weekly Lunch Menu</caption>
        <tr>
            <th>Day</th>
            <th>Main</th>
            <th>Side</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>Chicken Sandwich</td>
            <td>Fries</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Tacos</td>
            <td>Rice</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td colspan="2"> No School - Holiday</td>
        </tr>
    </table>
</body>
</html>
